# Render Blueprint (Infrastructure as Code)
# Deploys DraftSpace as a unified single-origin service with a dedicated PostgreSQL database.
version: "1"

services:
  - type: web
    name: draftspace-web
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate --schema=server/prisma/schema.prisma && npm run build
    startCommand: node server/scripts/db-setup.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: draftspace-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: draftspace-db
    plan: free
    region: oregon
    databaseName: draftspace
    user: draftspace
